# Reusable Renovate run. Each repo calls it from its own .github/workflows/renovate.yml with
# `secrets: inherit` and a RENOVATE_TOKEN repo secret (fine-grained PAT: contents, pull
# requests, issues, workflows: write; checks, commit statuses: read). GITHUB_TOKEN won't do:
# PRs it opens do not trigger CI, so nothing could automerge.
name: Renovate

on:
  workflow_call:
    inputs:
      logLevel:
        type: string
        default: info
      agent:
        description: Start the Renovate agent (renovate-agent.yml) for this repo afterwards
        type: boolean
        default: true
    secrets:
      RENOVATE_TOKEN:
        required: true

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required

  # Hands the repo to the Renovate agent in DiverOfDark/renovate-config, which triages the
  # PRs, fixes and merges the safe ones, and watches the rollout. Also after a failed
  # Renovate run: the PRs already open still get handled.
  agent:
    needs: renovate
    if: ${{ !cancelled() && inputs.agent }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the Renovate agent
        env:
          GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          gh api repos/DiverOfDark/renovate-config/dispatches \
            -f event_type=renovate-agent -f "client_payload[repo]=$REPO"
          echo "Started: https://github.com/DiverOfDark/renovate-config/actions/workflows/renovate-agent.yml"
