# Repos the Renovate agent handles, in this order.
#
# gitimage: <namespace>/<name> of the GitImage that deploys the repo's default branch. After
#   a merge the agent waits for it to build the merged commit and for every workload bound
#   to it to roll out and stay up, and reverts the merge if that fails. Repos without it
#   are not deployed straight from their default branch (released and bumped in homelab),
#   so only CI on the merged commit is watched.
# settle_minutes: how long CI on the merged commit and the rollout may take, default 30.
# deny: extra regexes; a PR touching a matching path is never merged by the agent.
repos:
  - repo: DiverOfDark/crier
    gitimage: crier/crier
  - repo: DiverOfDark/trmnl-cyberpunk
    gitimage: trmnl-cyberpunk/trmnl-cyberpunk
  - repo: DiverOfDark/trackhound
    gitimage: trackhound/trackhound
  - repo: DiverOfDark/hugin
    gitimage: hugin/hugin
  - repo: DiverOfDark/gjallarhorn
    gitimage: gjallarhorn/gjallarhorn
  - repo: DiverOfDark/about
    gitimage: homepage/about
  - repo: DiverOfDark/phos
    gitimage: phos/phos
    # Backend, frontend and Android app in one image build.
    settle_minutes: 60
  - repo: DiverOfDark/kata-pulse
  - repo: DiverOfDark/gitimage
    # The main pipeline runs the e2e matrix before it releases.
    settle_minutes: 90
